apiVersion: v1
kind: Service
metadata:
  name: query-service
  namespace: leaderboard
  labels:
    app.kubernetes.io/name: query-service
    app.kubernetes.io/part-of: real-time-leaderboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: query-service
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service
  namespace: leaderboard
  labels:
    app.kubernetes.io/name: query-service
    app.kubernetes.io/part-of: real-time-leaderboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: query-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: query-service
        app.kubernetes.io/part-of: real-time-leaderboard
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args:
            - until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: leaderboard-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: leaderboard-secrets
                  key: POSTGRES_DB
        - name: wait-for-redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args:
            - until REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli -h redis ping | grep -q PONG; do sleep 2; done
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: leaderboard-secrets
                  key: REDIS_PASSWORD
      containers:
        - name: query-service
          image: leaderboard-query:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
          env:
            - name: QUERY_GRPC_ADDR
              value: 0.0.0.0:50051
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: leaderboard-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: leaderboard-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: leaderboard-secrets
                  key: POSTGRES_DB
            - name: REDIS_ADDR
              value: redis:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: leaderboard-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_DB
              value: "0"
          startupProbe:
            grpc:
              port: 50051
              service: leaderboard.v1.LeaderboardQuery
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            grpc:
              port: 50051
              service: leaderboard.v1.LeaderboardQuery
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 50051
              service: leaderboard.v1.LeaderboardQuery
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
